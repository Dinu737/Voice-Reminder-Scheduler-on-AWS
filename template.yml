AWSTemplateFormatVersion: '2010-09-09'
Resources:

  ReminderBucket:
    Type: AWS::S3::Bucket

  ReminderTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: VoiceReminderTopic

  VoiceReminderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: VoiceReminderLambda
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: arn:aws:execute-api:ap-south-1:287871537034:r2h8porr02/*/POST/reminder
